{
  "profile_release": "23.0",
  "desktop_profile": "default/linux/amd64/23.0/desktop/plasma/systemd",
  "global_use": ["X", "wayland", "vulkan"],
  "video_cards": ["amdgpu", "radeonsi"],
  "package_use": [
    ["sys-libs/ncurses", "-gpm"],
    ["dev-python/pillow", "-truetype"],
    ["sys-apps/systemd", "boot", "ukify", "cryptsetup"],
    ["sys-kernel/installkernel", "systemd", "dracut", "systemd-boot", "ukify", "uki"],
    ["x11-libs/libdrm", "video_cards_radeon"],
    ["net-libs/gnutls", "pkcs11", "tools"]
  ],
  "package_accept_keywords": [
    ["sys-kernel/linux-firmware", "~amd64"],
    ["games-util/steam-launcher::steam-overlay", "~amd64"],
    ["gui-wm/gamescope", "~amd64"],
    ["sys-libs/libudev-compat", "~amd64"],
    ["games-util/game-device-udev-rules", "~amd64"],
    ["sys-firmware/edk2-bin", "~amd64"]
  ],
  "package_license": [
    ["sys-kernel/linux-firmware", "linux-fw-redistributable"],
    ["games-util/steam-launcher::steam-overlay", "ValveSteamLicense"]
  ],
  "sets": {
    "base": [
      "app-admin/sudo",
      "app-editors/neovim",
      "app-shells/bash-completion",
      "net-firewall/nftables",
      "net-misc/networkmanager",
      "sys-apps/pciutils",
      "sys-apps/usbutils",
      "sys-kernel/linux-firmware",
      "sys-fs/btrfs-progs",
      "sys-fs/cryptsetup",
      "sys-kernel/dracut",
      "sys-kernel/gentoo-kernel-bin",
      "sys-kernel/installkernel",
      "sys-process/htop"
    ],
    "desktop": [
      "kde-plasma/plasma-meta",
      "x11-misc/sddm",
      "media-video/pipewire",
      "media-video/wireplumber",
      "media-sound/alsa-utils",
      "media-libs/mesa",
      "media-libs/vulkan-loader",
      "gnome-extra/nm-applet",
      "sys-apps/zram-generator"
    ],
    "gaming": [
      "games-util/steam-launcher::steam-overlay",
      "games-util/gamemode",
      "gui-wm/gamescope"
    ],
    "development": [
      "dev-build/cmake",
      "dev-build/ninja",
      "dev-lang/go",
      "net-libs/nodejs",
      "dev-lang/python",
      "dev-lang/rust",
      "dev-vcs/git",
      "dev-debug/bpftrace",
      "llvm-core/clang",
      "llvm-core/lldb",
      "dev-util/bpftool",
      "sys-devel/gcc",
      "dev-debug/gdb",
      "sys-devel/binutils",
      "dev-util/perf"
    ],
    "virtualization": [
      "app-emulation/libvirt",
      "app-emulation/qemu",
      "app-emulation/virt-manager",
      "app-containers/distrobox",
      "app-containers/podman",
      "sys-firmware/edk2-bin"
    ],
    "security_backup": [
      "app-backup/restic",
      "net-firewall/nftables"
    ]
  }
}
